<!-- To add more icons, duplicate a section and find yout icon here -> https://fontawesome.com/v6.0/icons -->

<div class="social-links">
    {% if site.facebook %}
    <a class="link" data-title="facebook.com/{{ site.facebook }}" href="https://facebook.com/{{ site.facebook }}"
        target="_blank" rel="noopener">
        <i class="fa-brands fa-facebook"></i>
    </a>
    {% endif %}

    {% if site.twitter.username %}
    <a class="link" data-title="twitter.com/{{ site.twitter.username }}" href="https://twitter.com/{{ site.twitter.username }}"
        target="_blank" rel="noopener">
        <i class="fa-brands fa-twitter"></i>
    </a>
    {% endif %}

    {% if site.telegram %}
    <a class="link" data-title="t.me/{{ site.telegram }}" href="https://t.me/{{ site.telegram }}" target="_blank"
        rel="noopener">
        <i class="fa-brands fa-telegram"></i>
    </a>
    {% endif %}

    {% if site.instagram %}
    <a class="link" data-title="instagram.com/{{ site.instagram }}" href="https://instagram.com/{{ site.instagram }}"
        target="_blank" rel="noopener">
        <i class="fa-brands fa-instagram"></i>
    </a>
    {% endif %}

    {% if site.linkedin %}
    <a class="link" data-title="linkedin.com/in/{{ site.linkedin }}"
        href="https://www.linkedin.com/in/{{ site.linkedin }}" target="_blank" rel="noopener">
        <i class="fa-brands fa-linkedin"></i>
    </a>
    {% endif %}

    {% if site.github %}
    <a class="link" data-title="github.com/{{ site.github }}" href="https://github.com/{{ site.github }}"
        target="_blank" rel="noopener">
        <i class="fa-brands fa-github"></i>
    </a>
    {% endif %}

</div>
